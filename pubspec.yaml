name: personal_music_app
description: A simple personal cloud music app with online/offline playback.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5

  # Audio playback (background playback + streaming + local files)
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  audio_session: ^0.1.21

  # Downloads
  path_provider: ^2.1.3
  http: ^1.2.1

  # State management
  provider: ^6.1.2

  # Local persistence for "which songs are downloaded"
  shared_preferences: ^2.2.3

  # Connectivity check for offline mode
  connectivity_plus: ^6.0.3

  # Image handling
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  file_picker: ^8.0.6

  # Unique IDs
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
